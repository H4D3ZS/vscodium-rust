[package]
name = "hades-bridge"
version = "0.1.0"
edition = "2021"
description = "FFI bridge between HADES Kernel and llama.cpp inference engine"

[lib]
crate-type = ["cdylib", "rlib"]
name = "hades_bridge"

[dependencies]
hades-kernel = { path = "../hades-kernel" }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }

[build-dependencies]
cc = "1.0"
