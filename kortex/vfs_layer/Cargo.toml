[package]
name = "vfs_layer"
version = "0.1.0"
edition = "2024"
description = "AMD ROCm Cloud-enabled VFS layer with MI300X cloud-burst support"

[dependencies]
vfs = "0.13.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "1.0"
