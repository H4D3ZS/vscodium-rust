[package]
name = "hades-kernel"
version = "0.1.0"
edition = "2021"
description = "Sovereign substrate for 8GB VRAM-constrained neural paging with thermal governance"

[dependencies]
# Zero-copy I/O
memmap2 = "0.9"
io-uring = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "sync", "time"] }

# AMDGPU telemetry (Linux ROCm)
# For Windows: use WMI queries
[target.'cfg(target_os = "linux")'.dependencies]
glob = "0.3"
io-uring = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.14"
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Wmi", "Win32_Foundation"] }

# Cryptographic sealing
sha3 = "0.10"
blake3 = "1.5"
hex = "0.4"
bytemuck = "1.14"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["thermal-governor", "weight-streaming"]
thermal-governor = []
weight-streaming = []

[lib]
crate-type = ["lib"]

[[bin]]
name = "hades-governor"
path = "src/bin/governor.rs"
