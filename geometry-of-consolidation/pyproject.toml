[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gac"
version = "0.1.0"
description = "Geometry-Aware Consolidation for semantic memory systems."
authors = [{ name = "Ashwin Gopinath", email = "ashwin@sentra.app" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "tqdm>=4.66",
    "pyarrow>=15",
    "pandas>=2.2",
]

[project.optional-dependencies]
experiments = [
    "faiss-gpu-cu12>=1.8.0; platform_system == 'Linux'",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0",
    "datasets>=2.20",
    "hdbscan>=0.8",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
vllm = [
    "vllm>=0.5.0",
]
modal = [
    "modal>=0.64",
    "boto3>=1.34",
    "huggingface_hub>=0.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "ipython>=8.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gac*"]
exclude = ["tests*", "experiments*", "modal_app*", "notebooks*", "paper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
