name: Agent Core CI

on:
  workflow_dispatch:
  # DISABLED: Auto-run on push removed — manual trigger only

jobs:
  rust-backend-tests:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --all-targets

  frontend-checks:
    name: Frontend Typecheck + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + architecture check
        run: npm test

      - name: Build smoke check
        run: npm run build

  cargo-audit:
    name: cargo audit (informational)
    runs-on: ubuntu-latest
    # Non-blocking: a fresh advisory on an already-unmaintained transitive
    # (gtk3, unic-*) is not a regression we introduced. Keeps the 0-vuln
    # state visible without failing PRs on upstream's schedule.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        working-directory: src-tauri
        run: cargo audit

  macos-universal-build:
    name: macOS Universal Build
    runs-on: macos-latest
    if: github.ref == 'refs/heads/macos' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS bundle
        run: npm run build:mac
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
