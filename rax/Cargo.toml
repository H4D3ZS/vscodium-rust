[package]
name = "rax"
version = "0.1.0"
edition = "2024"

[features]
default = ["kvm", "smir-jit"]
kvm = ["kvm-bindings", "kvm-ioctls"]
hvf = []
trace = []
debug = []
profiling = []
# Verbose vphone-boot diagnostics (entry/seed/register dumps). OFF by default so
# release builds stay quiet and do not embed boot-internals strings in plaintext.
vphone-diag = []
x86_64-suite = []
x86-suite = ["x86_64-suite"]
# SMIR native hot-block JIT tier (x86-64 host only). ON by default: it is
# fail-safe (a region that is not register-only / touches RSP-RBP / memory bails
# to the interpreter) and boots Linux to userspace bit-exact vs the interpreter
# (verified with RAX_JIT_VERIFY=1). Brings in the W^X exec-mmap runtime (libc,
# always available on unix) + the X86_64Vcpu integration. Disable promotion at
# runtime with RAX_NO_JIT=1.
smir-jit = []

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"
thiserror = "2.0.17"
toml = "0.9.10"
bitflags = "2.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
vm-memory = { version = "0.17.1", default-features = false, features = ["backend-mmap"] }
goblin = "0.8.2"

# Profiling JSON export (optional)
serde_json = "1.0"

# Ctrl+C handling for graceful shutdown
ctrlc = "3.4"

# libc is used unconditionally on unix for terminal raw mode (termios), signal
# handlers that restore the TTY on crash, and the smir-jit W^X exec runtime.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows W^X exec runtime for the smir-jit tier (VirtualAlloc/VirtualProtect),
# the Unix mmap/mprotect equivalent. Diagnostic-only termios/signal paths stay
# unix-gated; the JIT itself runs on Windows x86-64.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

# KVM support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = "0.14.0", optional = true }
kvm-ioctls = { version = "0.24.0", optional = true }
linux-loader = { version = "0.13.2", default-features = false, features = ["bzimage", "elf"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3

[dev-dependencies]
libc = "0.2"
