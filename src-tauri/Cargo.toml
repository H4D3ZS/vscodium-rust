[package]
name = "vscode-rust-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "vscode-rust-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vscode_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memmap2 = "0.9.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0"
ropey = "1.6"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
walkdir = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8.1"
tokio-util = { version = "0.7.10", features = ["codec"] }
lsp-types = "0.94.1"
axum = "0.7"
anyhow = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
ripgrep = "15.1.0"
ripgrep-api = "0.2.0"
sysinfo = "0.30"
lz4_flex = "0.11"
zip = "0.6"
rand = { version = "=0.8.5", features = ["small_rng"] }
base64 = "0.21"
glob = "0.3"
regex = "1.12.3"
ignore = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3.32"
async-trait = "0.1.89"
urlencoding = "2.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-chrome = "0.7.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
chrono = "0.4"
libaim = { path = "../kortex/libaim" }
daemon = { path = "../kortex/daemon" }
candle-core = "=0.7.1"
half = { version = "=2.3.1", default-features = false, features = ["num-traits", "rand_distr"] }
which = "6.0"
diffy = "0.3"
notify = "8.2"
streaming-iterator = "0.1"
rayon = "1.10"
sha2 = "0.10"
tempfile = "3"
hades-harness = { path = "../kortex/harness" }
tokio-tungstenite = "0.20"
futures-util = "0.3"
bytes = "1"
lazy_static = "1.5.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rmp-serde = "1.3"

[[bench]]
name = "ipc_bench"
harness = false

# Standalone CLI shim around the kortex_gac module.
# Build with: cargo build --release --bin kortex-gac-cli
[[bin]]
name = "kortex-gac-cli"
path = "src/bin/kortex_gac_cli.rs"

# Standalone CLI shim around the kortex_kvcache proxy. Lets the launch script
# spawn the disk-persistent KV cache without booting the full Tauri IDE.
# Build with: cargo build --release --bin kortex-kvcache-cli
[[bin]]
name = "kortex-kvcache-cli"
path = "src/bin/kortex_kvcache_cli.rs"


[profile.bench]
debug = true

[profile.release]
panic = "abort"
lto = false
opt-level = 2
codegen-units = 1 # Minimize parallel memory usage
strip = false # Disable stripping to reduce post-build processing

[patch.crates-io]
rand = { git = "https://github.com/rust-random/rand", tag = "0.8.5" }
half = { git = "https://github.com/starkat99/half-rs", tag = "v2.3.1" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_Console",
] }
