[package]
name = "vscode-rust-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "vscode-rust-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vscode_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memmap2 = "0.9.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0"
ropey = "1.6"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8.1"
tokio-util = { version = "0.7.10", features = ["codec"] }
lsp-types = "0.94.1"
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
anyhow = "1"
sysinfo = "0.30"
lz4_flex = "0.11"
zip = "0.6"
headless_chrome = "1.0.12"
base64 = "0.21"
glob = "0.3"
regex = "1.12.3"
ignore = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3.32"
async-trait = "0.1.89"
urlencoding = "2.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-chrome = "0.7.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
chrono = "0.4"
libaim = { path = "../kortex/libaim" }
daemon = { path = "../kortex/daemon" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rmp-serde = "1.3"

[[bench]]
name = "ipc_bench"
harness = false


[profile.bench]
debug = true

[profile.release]
panic = "abort"
lto = false
opt-level = 2
codegen-units = 1 # Minimize parallel memory usage
strip = false # Disable stripping to reduce post-build processing
