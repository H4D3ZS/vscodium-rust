[package]
name = "vscode-rust-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "vscode-rust-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vscode_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Default build = the full Tauri/WebView IDE. The headless (gpui) shell depends
# on this crate with `default-features = false` to get the engine WITHOUT Tauri,
# WebView2, or the command layer — a lean native binary.
default = ["tauri"]
tauri = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-os",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-dialog",
    "dep:daemon",
    "dep:candle-core",
]

[dependencies]
boa_engine = "0.20"
memmap2 = "0.9.10"
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
ropey = "1.6"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "=0.23.0" # 0.23.2 parser.c fails MSVC 14.50 (C2099)
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs", "process", "signal"] }
walkdir = "2"
tauri-plugin-dialog = { version = "2", optional = true }
portable-pty = "0.9.0"
axum = "0.7"
anyhow = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
sysinfo = "0.30"
lz4_flex = "0.11"
zip = "0.6"
flate2 = "1"
rand = { version = "=0.8.5", features = ["small_rng"] }
base64 = "0.21"
glob = "0.3"
regex = "1.12.3"
ignore = "0.4"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
futures = "0.3.32"
url = "2.5"
urlencoding = "2.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
chrono = "0.4"
dirs = "5"
libaim = { path = "../kortex/libaim" }
aim-proxy = { path = "../kortex/aim-proxy" }
daemon = { path = "../kortex/daemon", optional = true }
candle-core = { version = "=0.7.1", optional = true }
which = "6.0"
diffy = "0.3"
notify = "6.1"
streaming-iterator = "0.1"
rayon = "1.10"
sha2 = "0.10"
tempfile = "3"
hades-harness = { path = "../kortex/harness" }
turbovec = { path = "../turbovec/turbovec" }
tokio-tungstenite = "0.20"
bytes = "1"
lazy_static = "1.5.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rmp-serde = "1.3"

[[bench]]
name = "ipc_bench"
harness = false

# Standalone CLI shim around the kortex_gac module.
# Build with: cargo build --release --bin kortex-gac-cli
[[bin]]
name = "kortex-gac-cli"
path = "src/bin/kortex_gac_cli.rs"
required-features = ["tauri"]

# Standalone CLI shim around the kortex_kvcache proxy. Lets the launch script
# spawn the disk-persistent KV cache without booting the full Tauri IDE.
# Build with: cargo build --release --bin kortex-kvcache-cli
[[bin]]
name = "kortex-kvcache-cli"
path = "src/bin/kortex_kvcache_cli.rs"
required-features = ["tauri"]


[profile.bench]
debug = true

[profile.release]
panic = "abort"
# lto=false / codegen-units=16 were Windows-linker workarounds
# (STATUS_ACCESS_VIOLATION with codegen-units=1). thin-LTO builds green on
# macOS (verified Milestone D) — revisit per-target profiles if Windows
# release builds regress.
lto = "thin"
opt-level = 2
codegen-units = 16
strip = true # smaller installer

[patch.crates-io]
rand = { git = "https://github.com/rust-random/rand", tag = "0.8.5" }
# rand's git tag pulls rand_core/rand_chacha from the same repo. Patch them
# explicitly too, so crates that depend on rand_core directly (e.g. rand_distr,
# used by turbovec) link the SAME rand_core instance — otherwise the git and
# crates.io copies of rand_core@0.6.4 are distinct crates and trait impls
# (SeedableRng/Distribution) don't line up. See turbovec integration.
rand_core = { git = "https://github.com/rust-random/rand", tag = "0.8.5" }
rand_chacha = { git = "https://github.com/rust-random/rand", tag = "0.8.5" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
